limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
log_format portfolio escape=json '{"time":"$time_iso8601","method":"$request_method","uri":"$uri","status":$status,"duration":$request_time}';
server {
    listen 8080;
    server_tokens off;
    client_max_body_size 128k;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; img-src 'self' data:; form-action 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    access_log /var/log/portfolio/access.log portfolio;
    error_log /dev/stderr warn;
    location = /login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
    }
    location ~ \.php$ { return 404; }
    location / {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
server {
    listen 8081;
    access_log off;
    location = /stub_status { stub_status; }
    location / { return 404; }
}
