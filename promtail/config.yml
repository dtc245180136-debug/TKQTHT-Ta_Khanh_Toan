server:
  http_listen_port: 9080
  grpc_listen_port: 0
positions:
  filename: /positions/positions.yml
clients:
  - url: http://loki:3100/loki/api/v1/push
scrape_configs:
  - job_name: application
    static_configs:
      - targets: [localhost]
        labels:
          job: portfolio-app
          __path__: /logs/app/*.log
  - job_name: nginx
    static_configs:
      - targets: [localhost]
        labels:
          job: portfolio-nginx
          __path__: /logs/nginx/*.log
